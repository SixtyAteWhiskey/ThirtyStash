{% extends 'base.html' %}
{% block title %}Edit food · ThirtyStash{% endblock %}
{% block content %}
<section class="page-head"><div><span class="eyebrow">Food inventory</span><h1>Edit {{ item.name }}</h1><p>Update this specific lot without changing other copies of the same product.</p></div></section>
<section class="card form-card">
<form method="post" class="form-grid compact"><input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
<label>Barcode<input name="barcode" inputmode="numeric" maxlength="64" value="{{ item.barcode or '' }}"></label><label>Lot / batch<input name="lot_label" maxlength="120" value="{{ item.lot_label or '' }}"></label>
<label class="span-2">Food name<input name="name" required maxlength="180" value="{{ item.name }}"></label><label class="span-2">Brand<input name="brand" maxlength="180" value="{{ item.brand or '' }}"></label>
<label>Total food amount<div class="unit-input"><input name="total_amount" type="number" step="0.01" min="0.01" required value="{{ item.total_grams or item.quantity_units }}"><select name="total_amount_unit"><option value="g" selected>grams</option><option value="kg">kg</option><option value="oz">oz</option><option value="lb">lb</option></select></div></label>
<label>Serving size<div class="unit-input"><input name="serving_size" type="number" step="0.01" min="0.01" required value="{{ item.serving_size_g or 100 }}"><select name="serving_size_unit"><option value="g" selected>grams</option><option value="oz">oz</option><option value="lb">lb</option></select></div></label>
<label>Calories per serving<input name="calories_per_serving" type="number" step="0.1" min="0" max="10000" required value="{{ item.calories_per_serving if item.calories_per_serving is not none else 0 }}"></label><label>Purchased / stored<input name="purchase_date" type="date" max="{{ today }}" value="{{ item.purchase_date or '' }}"></label>
<label>Expiry date<input name="expiry_date" type="date" value="{{ item.expiry_date or '' }}"></label><label>Inspection interval<select name="inspection_interval_days">{% for d in [30,60,75,90,180] %}<option value="{{ d }}" {{ 'selected' if item.inspection_interval_days == d else '' }}>{{ d }} days</option>{% endfor %}</select></label>
<label>Last inspected<input name="last_inspected" type="date" max="{{ today }}" value="{{ item.last_inspected or '' }}"></label><label class="span-2">Notes<textarea name="notes" rows="3" maxlength="5000">{{ item.notes or '' }}</textarea></label>
<div class="span-2 edit-actions"><a class="btn ghost" href="{{ url_for('food') }}">Cancel</a><button class="btn primary">Save changes</button></div>
</form></section>
{% endblock %}
