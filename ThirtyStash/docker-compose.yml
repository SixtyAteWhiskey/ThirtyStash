services:
  thirtystash:
    build: .
    restart: unless-stopped
    init: true
    ports:
      - "3055:3055"
    environment:
      SECRET_KEY_FILE: /data/.thirtystash-secret
      OFF_USER_AGENT: "ThirtyStash/1.2.0-beta.1 (self-hosted preparedness inventory)"
      DATABASE_URL: sqlite:////data/thirtystash.db
      BACKUP_ROOT: /backups
      BACKUP_HOST_PATH: ${THIRTYSTASH_BACKUP_DIR:-./backups}
    volumes:
      - thirtystash_data:/data
      - ${THIRTYSTASH_BACKUP_DIR:-./backups}:/backups
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:3055/healthz', timeout=3).read()"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

  thirtystash-backup:
    build: .
    restart: unless-stopped
    init: true
    command: ["python", "backup_scheduler.py"]
    environment:
      SECRET_KEY_FILE: /data/.thirtystash-secret
      OFF_USER_AGENT: "ThirtyStash/1.2.0-beta.1 (self-hosted preparedness inventory)"
      DATABASE_URL: sqlite:////data/thirtystash.db
      BACKUP_ROOT: /backups
      BACKUP_HOST_PATH: ${THIRTYSTASH_BACKUP_DIR:-./backups}
    volumes:
      - thirtystash_data:/data
      - ${THIRTYSTASH_BACKUP_DIR:-./backups}:/backups
    security_opt:
      - no-new-privileges:true
    depends_on:
      thirtystash:
        condition: service_healthy

volumes:
  thirtystash_data:
